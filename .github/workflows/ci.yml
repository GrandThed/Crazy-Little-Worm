name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: StyLua + Selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the exact tool versions pinned in rokit.toml
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: StyLua (format check)
        run: stylua --check game/src

      - name: Selene (lint)
        run: selene game/src
